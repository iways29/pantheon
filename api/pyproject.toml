[project]
name = "pantheon-api"
version = "0.1.0"
description = "Pantheon API: FastAPI backend deployed as Vercel Functions"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.117.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.9",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "httpx>=0.27",
    "langfuse>=4.15.4,<5",
    "opentelemetry-api>=1.33.1,<2",
    "opentelemetry-sdk>=1.33.1,<2",
    "langgraph>=1.2.11,<2",
    "langgraph-checkpoint-postgres==3.1.2",
    "psycopg-pool>=3.2",
    "langchain>=1.4.2,<2",
    "deepagents>=0.7.19",
    "mcp>=2.2,<3",
]

[dependency-groups]
dev = [
    "fastapi[standard]>=0.117.1",
    "httpx>=0.27",
    "pytest>=8.3",
    "ruff>=0.7",
]

# Vercel builds this directory with the `fastapi` framework preset and imports
# the ASGI app from here. See docs/adr/0001-monorepo-and-deployment-layout.md.
[tool.vercel]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
